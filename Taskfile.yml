version: '3'

tasks:
  help:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install the package
    cmds:
      - pip install -e .

  install-dev:
    desc: Install with development dependencies
    cmds:
      - pip install -e ".[dev]"

  install-test:
    desc: Install with test dependencies
    cmds:
      - pip install -e ".[test]"

  install-all:
    desc: Install all dependencies
    cmds:
      - pip install -e ".[all]"

  clean:
    desc: Clean all generated files
    cmds:
      - rm -rf build/
      - rm -rf dist/
      - rm -rf .eggs/
      - rm -rf *.egg-info/
      - rm -rf .pytest_cache/
      - rm -rf .coverage
      - rm -rf coverage.xml
      - rm -rf htmlcov/
      - rm -rf .mypy_cache/
      - rm -rf .ruff_cache/
      - find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete

  lint:
    desc: Run all linters
    cmds:
      - ruff check .
      - mypy scikitplot --ignore-missing-imports

  format:
    desc: Format code with black and isort
    cmds:
      - black .
      - isort .

  check:
    desc: Run format check without modifying files
    cmds:
      - black --check .
      - isort --check-only --diff .
      - ruff check .

  test:
    desc: Run tests
    cmds:
      - pytest -v
    env:
      MPLBACKEND: Agg

  test-cov:
    desc: Run tests with coverage report
    cmds:
      - pytest -v --cov=scikitplot --cov-report=term-missing --cov-report=html --cov-report=xml
    env:
      MPLBACKEND: Agg

  test-all:
    desc: Run tests on all Python versions
    cmds:
      - tox

  build:
    desc: Build the package
    cmds:
      - python -m build
      - twine check dist/*

  build-docs:
    desc: Build documentation
    cmds:
      - cd docs && make clean html

  docs:
    desc: Build and serve documentation locally
    deps: [build-docs]
    cmds:
      - echo "Documentation available at http://localhost:8000"
      - python -m http.server 8000 -d docs/_build/html

  docker-build:
    desc: Build Docker images
    cmds:
      - docker-compose build

  docker-test:
    desc: Run tests in Docker
    cmds:
      - docker-compose run --rm test

  docker-dev:
    desc: Start development environment
    cmds:
      - docker-compose run --rm development

  docker-jupyter:
    desc: Start Jupyter Lab in Docker
    cmds:
      - docker-compose up jupyter

  docker-clean:
    desc: Clean Docker resources
    cmds:
      - docker-compose down -v --remove-orphans
      - docker system prune -f

  pre-commit:
    desc: Install and run pre-commit hooks
    cmds:
      - pre-commit install
      - pre-commit run --all-files

  setup:
    desc: Initial project setup
    deps: [install-all]
    cmds:
      - task: pre-commit
      - echo "Project setup complete!"

  security:
    desc: Run security checks
    cmds:
      - pip install safety
      - safety check

  release:
    desc: Create a new release
    vars:
      VERSION:
        prompt: Enter version (e.g., 0.3.8)
    cmds:
      - git tag -a v{{.VERSION}} -m "Release v{{.VERSION}}"
      - git push origin v{{.VERSION}}

  update:
    desc: Update dependencies
    cmds:
      - pip install --upgrade pip setuptools wheel
      - pip install --upgrade -e ".[all]"

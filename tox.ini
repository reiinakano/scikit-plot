# Tox configuration for scikit-plot
# Run tests across multiple Python versions and environments

[tox]
minversion = 4.0
envlist =
    py39
    py310
    py311
    py312
    lint
    type
    docs
    coverage
isolated_build = true
skip_missing_interpreters = true

[testenv]
description = Run tests with pytest
extras = test
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
commands =
    pytest {posargs:scikitplot/tests} -v --cov=scikitplot --cov-append

[testenv:py39]
basepython = python3.9

[testenv:py310]
basepython = python3.10

[testenv:py311]
basepython = python3.11

[testenv:py312]
basepython = python3.12

[testenv:lint]
description = Run linting checks
extras = dev
commands =
    ruff check scikitplot
    black --check scikitplot
    isort --check-only scikitplot

[testenv:format]
description = Format code
extras = dev
commands =
    black scikitplot
    isort scikitplot
    ruff check scikitplot --fix

[testenv:type]
description = Run type checking
extras = dev
deps =
    mypy>=1.5.0
commands =
    mypy scikitplot --ignore-missing-imports

[testenv:docs]
description = Build documentation
extras = docs
changedir = docs
commands =
    sphinx-build -W -b html -d {envtmpdir}/doctrees . _build/html

[testenv:docs-live]
description = Serve documentation with auto-reload
extras = docs
deps =
    sphinx-autobuild
changedir = docs
commands =
    sphinx-autobuild . _build/html --host 0.0.0.0 --port 8000

[testenv:coverage]
description = Generate coverage report
deps =
    coverage[toml]
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands =
    coverage combine
    coverage report
    coverage html
    coverage xml

[testenv:clean]
description = Clean build artifacts
skip_install = true
deps =
commands =
    python -c "import shutil; shutil.rmtree('build', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.tox', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.pytest_cache', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('htmlcov', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('.coverage', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('coverage.xml', ignore_errors=True)"
    python -c "import shutil; shutil.rmtree('scikit_plot.egg-info', ignore_errors=True)"

[testenv:build]
description = Build package distributions
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine check dist/*

[testenv:release-test]
description = Release to TestPyPI
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine upload --repository testpypi dist/*

[testenv:release]
description = Release to PyPI
skip_install = true
deps =
    build
    twine
commands =
    python -m build
    twine upload dist/*

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312, lint, type, docs

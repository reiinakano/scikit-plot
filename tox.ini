[tox]
envlist = py39, py310, py311, py312, lint, docs
isolated_build = True
skip_missing_interpreters = True

[testenv]
description = Run tests with pytest
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    pytest-mpl>=0.16.0
extras = test
commands =
    pytest -v --cov=scikitplot --cov-report=term-missing --cov-report=xml {posargs}
setenv =
    MPLBACKEND = Agg
    PYTHONUNBUFFERED = 1
passenv =
    CI
    GITHUB_ACTIONS

[testenv:lint]
description = Run code quality checks
basepython = python3.11
deps =
    ruff>=0.1.0
    black>=23.0.0
    isort>=5.12.0
    mypy>=1.0.0
commands =
    ruff check .
    black --check .
    isort --check-only --diff .
    mypy scikitplot --ignore-missing-imports

[testenv:format]
description = Format code
basepython = python3.11
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    black .
    isort .

[testenv:docs]
description = Build documentation
basepython = python3.11
extras = docs
commands =
    sphinx-build -b html docs docs/_build/html

[testenv:build]
description = Build the package
basepython = python3.11
deps =
    build>=0.10.0
    twine>=4.0.0
commands =
    python -m build
    twine check dist/*

[testenv:clean]
description = Clean generated files
basepython = python3.11
skip_install = True
commands =
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree("dist", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree(".tox", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree(".pytest_cache", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree(".mypy_cache", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree(".ruff_cache", ignore_errors=True)'
    python -c 'import shutil; shutil.rmtree("htmlcov", ignore_errors=True)'
    python -c 'import os; os.remove("coverage.xml") if os.path.exists("coverage.xml") else None'

[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .tox,
    .mypy_cache,
    .pytest_cache,
    docs,
    examples

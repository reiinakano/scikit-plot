[tox]
envlist = py39, py310, py311, py312, lint, type-check
isolated_build = True

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
commands =
    pytest {posargs}

[testenv:lint]
deps =
    ruff>=0.1.0
    black>=23.0.0
    isort>=5.12.0
commands =
    ruff check scikitplot
    black --check scikitplot
    isort --check-only scikitplot

[testenv:type-check]
deps =
    mypy>=1.5.0
commands =
    mypy scikitplot --ignore-missing-imports

[testenv:coverage]
deps =
    {[testenv]deps}
    pytest-cov>=4.0.0
commands =
    pytest --cov=scikitplot --cov-report=html --cov-report=xml

[testenv:docs]
deps =
    sphinx>=7.0.0
    sphinx-rtd-theme>=1.3.0
    sphinx-autodoc-typehints>=1.24.0
commands =
    sphinx-build -W -b html docs docs/_build/html

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312, lint, type-check

[pytest]
# Configuration for notebook-specific testing
# Usage: pytest -c pytest-notebook.ini

testpaths = scikitplot/tests/notebooks examples/jupyter_notebooks
python_files = test_*.py *.ipynb
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --nbval
    --nbval-lax

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    plot: marks tests that generate plots
    notebook: marks tests that run Jupyter notebooks

filterwarnings =
    ignore::DeprecationWarning:matplotlib.*
    ignore::PendingDeprecationWarning:sklearn.*
    ignore::UserWarning:nbformat.*
    ignore::RuntimeWarning:ipykernel.*

norecursedirs =
    .git
    .tox
    .env
    .venv
    dist
    build
    *.egg-info
    _build
    .ipynb_checkpoints

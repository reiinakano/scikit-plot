name: scikit-plot-env

channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python>=3.9,<3.13

  # Core dependencies
  - numpy>=1.21.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.5.0
  - joblib>=1.0.0

  # Development dependencies
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - black>=23.0.0
  - isort>=5.12.0
  - ruff>=0.1.0
  - mypy>=1.5.0
  - pre-commit>=3.0.0

  # Documentation dependencies
  - sphinx>=5.0.0
  - sphinx_rtd_theme>=1.3.0
  - nbsphinx>=0.9.0
  - ipython>=8.0.0
  - jupyter>=1.0.0

  # Additional tools
  - pip
  - git

  # Pip-only dependencies
  - pip:
    - sphinx-autodoc-typehints>=1.24.0
    - pytest-xdist>=3.0.0
